# Mouse wheel scrolls tmux history; click to select panes
set -g mouse on

# --- Session persistence (tmux-resurrect + tmux-continuum) ---
set -g @resurrect-capture-pane-contents 'on'  # keep on-screen text
set -g @continuum-restore 'on'                # auto-restore when the server starts
set -g @continuum-save-interval '5'           # auto-save every 5 minutes
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux  # keep last: hooks status-right
